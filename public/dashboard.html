<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="imsge/png" href="logo.png">
    <title>Dashboard — Quizzers Anonymous</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Lato", sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            padding: 40px;
            overflow-x: hidden;
        }

        /* ── HEADER ── */

        header {
            border-bottom: 1px solid #fff;
            padding-bottom: 20px;
            margin-bottom: 48px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        header p.eyebrow {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 6px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* ── USER CARD ── */

        .user-card {
            border: 1px solid rgba(255,255,255,0.2);
            padding: 24px 28px;
            margin-bottom: 48px;
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .user-avatar {
            width: 52px;
            height: 52px;
            border: 1px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 0.02em;
            flex-shrink: 0;
        }

        .user-info p.user-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
        }

        .user-info p.user-id {
            font-size: 11px;
            font-family: monospace;
            opacity: 0.4;
            letter-spacing: 0.1em;
        }

        /* ── SECTION ── */

        .section-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 16px;
        }

        /* ── EVENT LIST ── */

        #eventList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        #eventList li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 14px;
        }

        #eventList li .event-name {
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        #eventList li .event-status {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.5;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 4px 12px;
        }

        #eventList li.empty {
            opacity: 0.3;
            font-style: italic;
            justify-content: flex-start;
        }

        /* ── BUTTON ── */

        button {
            background: #000;
            border: 1px solid rgba(255,255,255,0.3);
            color: rgba(255,255,255,0.5);
            font-family: "Lato", sans-serif;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 9px 22px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        button:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* ── FOOTER ── */

        footer {
            border-top: 1px solid rgba(255,255,255,0.12);
            margin-top: 48px;
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer span {
            font-size: 10px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.25;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media screen and (max-width: 600px) {

            body {
                width: 100%;
                min-width: 100%;
                padding: 0;
            }

            /* HEADER */

            header {
                width: 100%;
                padding: 34px 24px 26px;
                margin-bottom: 36px;
                display: block;
            }

            header p.eyebrow {
                font-size: 13px;
                letter-spacing: 0.22em;
                margin-bottom: 10px;
            }

            header h1 {
                font-size: 40px;
                line-height: 1;
                letter-spacing: 0.06em;
            }

            /* USER CARD */

            .user-card {
                width: calc(100% - 48px);
                margin: 0 24px 40px;
                padding: 24px 20px;
                gap: 20px;
            }

            .user-avatar {
                width: 60px;
                height: 60px;
                min-width: 60px;
                font-size: 23px;
            }

            .user-info {
                min-width: 0;
            }

            .user-info p.user-name {
                font-size: 20px;
                line-height: 1.2;
                overflow-wrap: anywhere;
            }

            .user-info p.user-id {
                font-size: 11px;
                margin-top: 5px;
            }

            /* SECTION */

            .section-label {
                width: calc(100% - 48px);
                margin-left: 24px;
                margin-right: 24px;
                font-size: 12px;
                letter-spacing: 0.23em;
                margin-bottom: 14px;
            }

            /* EVENT LIST */

            #eventList {
                width: calc(100% - 48px);
                margin-left: 24px;
                margin-right: 24px;
                gap: 4px;
            }

            #eventList li {
                width: 100%;
                min-height: 64px;
                padding: 17px 18px;
                font-size: 16px;
                gap: 15px;
            }

            #eventList li .event-name {
                font-size: 16px;
                line-height: 1.3;
                overflow-wrap: anywhere;
            }

            #eventList li .event-status {
                flex-shrink: 0;
                font-size: 10px;
                letter-spacing: 0.16em;
                padding: 6px 10px;
            }

            #eventList li.empty {
                min-height: 60px;
                font-size: 14px;
            }

            /* FOOTER */

            footer {
                width: calc(100% - 48px);
                margin: 40px 24px 0;
                padding-top: 20px;
            }

            footer span {
                font-size: 11px;
                letter-spacing: 0.15em;
            }

            footer button {
                min-height: 46px;
                padding: 12px 22px;
                font-size: 12px;
            }
        }


        /* =====================================================
           SMALL PHONES
           ===================================================== */

        @media screen and (max-width: 400px) {

            header {
                padding-left: 20px;
                padding-right: 20px;
                padding-top: 28px;
                margin-bottom: 32px;
            }

            header p.eyebrow {
                font-size: 12px;
            }

            header h1 {
                font-size: 36px;
            }

            .user-card {
                width: calc(100% - 40px);
                margin-left: 20px;
                margin-right: 20px;
                margin-bottom: 34px;
                padding: 21px 17px;
                gap: 17px;
            }

            .user-avatar {
                width: 56px;
                height: 56px;
                min-width: 56px;
                font-size: 21px;
            }

            .user-info p.user-name {
                font-size: 18px;
            }

            .section-label {
                width: calc(100% - 40px);
                margin-left: 20px;
                margin-right: 20px;
                font-size: 11px;
            }

            #eventList {
                width: calc(100% - 40px);
                margin-left: 20px;
                margin-right: 20px;
            }

            #eventList li {
                min-height: 61px;
                padding: 16px;
                font-size: 15px;
            }

            #eventList li .event-name {
                font-size: 15px;
            }

            #eventList li .event-status {
                font-size: 9px;
                padding: 5px 8px;
            }

            footer {
                width: calc(100% - 40px);
                margin-left: 20px;
                margin-right: 20px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media screen and (max-width: 340px) {

            header {
                padding-left: 16px;
                padding-right: 16px;
            }

            header h1 {
                font-size: 32px;
            }

            .user-card {
                width: calc(100% - 32px);
                margin-left: 16px;
                margin-right: 16px;
                padding: 18px 14px;
            }

            .user-avatar {
                width: 52px;
                height: 52px;
                min-width: 52px;
            }

            .section-label {
                width: calc(100% - 32px);
                margin-left: 16px;
                margin-right: 16px;
            }

            #eventList {
                width: calc(100% - 32px);
                margin-left: 16px;
                margin-right: 16px;
            }

            #eventList li {
                padding: 15px 13px;
            }

            #eventList li .event-name {
                font-size: 14px;
            }

            footer {
                width: calc(100% - 32px);
                margin-left: 16px;
                margin-right: 16px;
            }

            footer span {
                font-size: 9px;
            }

            footer button {
                font-size: 11px;
                padding: 10px 16px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <p class="eyebrow">Quizzers Anonymous</p>
            <h1>Dashboard</h1>
        </div>
    </header>

    <div class="user-card">
        <div class="user-avatar" id="userAvatar">?</div>
        <div class="user-info">
            <p class="user-name" id="welcome"></p>
            <p class="user-id" id="userId"></p>
        </div>
    </div>

    <p class="section-label">Your Registered Events</p>
    <ul id="eventList"></ul>

    <footer>
        <span>Quizzers Anonymous</span>
        <button onclick="logout()">Logout</button>
    </footer>

    <script>
        const SERVER_URL = "";
        const name   = sessionStorage.getItem("name");
        const userId = sessionStorage.getItem("userId");

        if (!name) window.location.href = "login.html";

        document.getElementById("welcome").innerText   = name;
        document.getElementById("userId").innerText    = `ID: ${userId}`;
        document.getElementById("userAvatar").innerText = name ? name.charAt(0).toUpperCase() : "?";

        async function loadEvents() {
            const response = await fetch(`${SERVER_URL}/api/get-user?userId=${userId}`);
            const result   = await response.json();
            const list = document.getElementById("eventList");

            if (result.events && result.events.length > 0) {
                result.events.forEach(ev => {
                    const li = document.createElement("li");
                    li.innerHTML = `
                        <span class="event-name">${ev.event_name}</span>
                        <span class="event-status">${ev.status}</span>
                    `;
                    list.appendChild(li);
                });
            } else {
                const li = document.createElement("li");
                li.className = "empty";
                li.innerText = "No events registered yet.";
                list.appendChild(li);
            }
        }

        loadEvents();

        function logout() {
            sessionStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
