<!DOCTYPE html>
<html>
<head>
    <link rel="icon" type="imsge/png" href="logo.png">
    <title>Register — Quizzers Anonymous</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
       

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: "Lato", sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    overflow-x: hidden;
}

.card {
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
}

.card-header {
    border-bottom: 1px solid #fff;
    padding-bottom: 20px;
    margin-bottom: 40px;
}

.card-header p {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.4;
    margin-bottom: 6px;
}

.card-header h1 {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 0.06em;
    text-transform: uppercase;
}

.field {
    margin-bottom: 16px;
}

.field label {
    display: block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.4;
    margin-bottom: 8px;
}

.field input {
    width: 100%;
    background: #000;
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    font-family: "Lato", sans-serif;
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
}

.field input::placeholder {
    color: rgba(255,255,255,0.2);
}

.field input:focus {
    border-color: #fff;
    box-shadow: 0 0 0 1px #fff;
}

button {
    width: 100%;
    background: #fff;
    border: 1px solid #fff;
    color: #000;
    font-family: "Lato", sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 13px;
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.15s, color 0.15s;
}

button:hover {
    background: #000;
    color: #fff;
}

#msg {
    margin-top: 16px;
    font-size: 12px;
    letter-spacing: 0.06em;
    opacity: 0.6;
    text-align: center;
    min-height: 18px;
}

#msg.error {
    opacity: 1;
    text-decoration: underline;
}

.card-footer {
    margin-top: 24px;
    text-align: center;
}

.card-footer a {
    font-size: 12px;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    letter-spacing: 0.05em;
    border-bottom: 1px solid rgba(255,255,255,0.2);
    padding-bottom: 1px;
    transition: color 0.15s, border-color 0.15s;
}

.card-footer a:hover {
    color: #fff;
    border-color: #fff;
}


/* =========================================================
   MOBILE — USE ALMOST THE ENTIRE SCREEN
   ========================================================= */

@media screen and (max-width: 600px) {

    body {
        display: block;
        width: 100%;
        min-height: 100dvh;
        padding: 0;
    }

    .card {
        width: 100%;
        max-width: none;
        min-height: 100dvh;
        padding: 40px 28px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .card-header {
        width: 100%;
        padding-bottom: 25px;
        margin-bottom: 45px;
    }

    .card-header p {
        font-size: 13px;
        letter-spacing: 0.22em;
        margin-bottom: 10px;
    }

    .card-header h1 {
        font-size: 42px;
        line-height: 1;
        letter-spacing: 0.07em;
    }

    .field {
        width: 100%;
        margin-bottom: 25px;
    }

    .field label {
        font-size: 12px;
        letter-spacing: 0.2em;
        margin-bottom: 10px;
    }

    .field input {
        width: 100%;
        height: 60px;
        padding: 15px 17px;
        font-size: 18px;
    }

    button {
        width: 100%;
        height: 60px;
        min-height: 60px;
        padding: 15px;
        margin-top: 10px;
        font-size: 15px;
        letter-spacing: 0.13em;
    }

    #msg {
        width: 100%;
        margin-top: 20px;
        font-size: 14px;
        min-height: 22px;
    }

    .card-footer {
        width: 100%;
        margin-top: 32px;
    }

    .card-footer a {
        font-size: 14px;
        padding-bottom: 3px;
    }
}


/* =========================================================
   SMALL PHONES
   ========================================================= */

@media screen and (max-width: 400px) {

    .card {
        padding: 32px 22px;
    }

    .card-header {
        margin-bottom: 38px;
    }

    .card-header p {
        font-size: 12px;
    }

    .card-header h1 {
        font-size: 38px;
    }

    .field {
        margin-bottom: 22px;
    }

    .field input {
        height: 57px;
        font-size: 17px;
    }

    button {
        height: 57px;
        min-height: 57px;
        font-size: 14px;
    }
}


/* =========================================================
   VERY SMALL PHONES
   ========================================================= */

@media screen and (max-width: 340px) {

    .card {
        padding: 28px 18px;
    }

    .card-header {
        margin-bottom: 32px;
    }

    .card-header h1 {
        font-size: 34px;
    }

    .field {
        margin-bottom: 19px;
    }

    .field input {
        height: 54px;
        font-size: 16px;
    }

    button {
        height: 54px;
        min-height: 54px;
        font-size: 13px;
    }
}


/* =========================================================
   LANDSCAPE PHONES
   ========================================================= */

@media screen and (max-height: 500px) and (orientation: landscape) {

    body {
        display: block;
        padding: 0;
    }

    .card {
        min-height: auto;
        padding: 25px 30px;
        justify-content: flex-start;
    }

    .card-header {
        margin-bottom: 25px;
    }

    .field {
        margin-bottom: 15px;
    }

    .field input {
        height: 45px;
    }

    button {
        height: 45px;
        min-height: 45px;
    }
}
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <p>Quizzers Anonymous</p>
            <h1>Register</h1>
        </div>

        <div class="field">
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Your full name">
        </div>

        <div class="field">
            <label for="email">Phone Number</label>
            <input id="email" type="text" placeholder="Your Phone Number">
        </div>

        <div class="field">
            <label for="pswd">Password</label>
            <input id="pswd" type="password" placeholder="••••••••">
        </div>

        <button onclick="register()">Create Account</button>

        <p id="msg"></p>

        <div class="card-footer">
            <a href="login.html">Already have an account?</a>
        </div>
    </div>

    <script>
        const SERVER_URL = "";

        document.addEventListener("keydown", e => { if (e.key === "Enter") register(); });

        async function register() {
            const msg  = document.getElementById("msg");
            const user = {
                name:     document.getElementById("name").value,
                email:    document.getElementById("email").value,
                password: document.getElementById("pswd").value
            };

            msg.className = "";
            msg.innerText = "Creating account...";

            const response = await fetch(`${SERVER_URL}/api/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(user)
            });

            const result = await response.json();

            if (result.userId) {
                msg.className = "";
                msg.innerText = "Account created — redirecting to login...";
                setTimeout(() => { window.location.replace("login.html"); }, 2000);
            } else {
                msg.className = "error";
                msg.innerText = result.error;
            }
        }
    </script>
</body>
</html>
