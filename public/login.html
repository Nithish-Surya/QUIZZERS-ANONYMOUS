
<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="imsge/png" href="logo.png">
    <title>Login — Quizzers Anonymous</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #000;
            color: #fff;
            font-family: "Lato", sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .card {
            width: 100%;
            max-width: 400px;
        }

        /* ── HEADER ── */

        .card-header {
            border-bottom: 1px solid #fff;
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        .card-header p {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 6px;
        }

        .card-header h1 {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        /* ── FORM ── */

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.4;
            margin-bottom: 8px;
        }

        .field input {
            width: 100%;
            background: #000;
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            font-family: "Lato", sans-serif;
            font-size: 14px;
            padding: 12px 14px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .field input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .field input:focus {
            border-color: #fff;
            box-shadow: 0 0 0 1px #fff;
        }

        /* ── BUTTON ── */

        button {
            width: 100%;
            background: #fff;
            border: 1px solid #fff;
            color: #000;
            font-family: "Lato", sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 13px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s, color 0.15s;
        }

        button:hover {
            background: #000;
            color: #fff;
        }

        /* ── FOOTER LINK ── */

        .card-footer {
            margin-top: 24px;
            text-align: center;
        }

        .card-footer a {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            letter-spacing: 0.05em;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 1px;
            transition: color 0.15s, border-color 0.15s;
        }

        .card-footer a:hover {
            color: #fff;
            border-color: #fff;
        }

        /* ── MESSAGE ── */

        #msg {
            margin-top: 16px;
            font-size: 12px;
            letter-spacing: 0.06em;
            opacity: 0.6;
            text-align: center;
            min-height: 18px;
        }

        #msg.error {
            opacity: 1;
            text-decoration: underline;
        }


        /* =====================================================
           MOBILE
           ===================================================== */

        @media screen and (max-width: 600px) {

            html,
            body {
                width: 100%;
                min-width: 100%;
                max-width: 100%;
            }

            body {
                min-height: 100vh;
                min-height: 100dvh;
                padding: 0;
                display: block;
            }

            .card {
                width: 100%;
                max-width: none;
                min-height: 100vh;
                min-height: 100dvh;

                padding: 40px 24px;

                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            /* HEADER */

            .card-header {
                width: 100%;
                padding-bottom: 28px;
                margin-bottom: 42px;
            }

            .card-header p {
                font-size: 14px;
                letter-spacing: 0.22em;
                margin-bottom: 11px;
            }

            .card-header h1 {
                font-size: 44px;
                line-height: 1;
                letter-spacing: 0.07em;
            }

            /* FORM */

            .field {
                width: 100%;
                margin-bottom: 26px;
            }

            .field label {
                font-size: 12px;
                letter-spacing: 0.2em;
                margin-bottom: 11px;
            }

            .field input {
                width: 100%;
                height: 62px;
                padding: 16px 17px;
                font-size: 18px;
            }

            /* BUTTON */

            button {
                width: 100%;
                height: 62px;
                min-height: 62px;
                padding: 16px;
                margin-top: 10px;
                font-size: 16px;
                letter-spacing: 0.14em;
            }

            /* MESSAGE */

            #msg {
                width: 100%;
                margin-top: 20px;
                font-size: 14px;
                line-height: 1.5;
                min-height: 22px;
            }

            /* FOOTER */

            .card-footer {
                width: 100%;
                margin-top: 34px;
            }

            .card-footer a {
                font-size: 14px;
                padding-bottom: 3px;
            }
        }


        /* =====================================================
           SMALL PHONES
           ===================================================== */

        @media screen and (max-width: 400px) {

            .card {
                padding: 32px 20px;
            }

            .card-header {
                padding-bottom: 25px;
                margin-bottom: 36px;
            }

            .card-header p {
                font-size: 12px;
            }

            .card-header h1 {
                font-size: 40px;
            }

            .field {
                margin-bottom: 23px;
            }

            .field label {
                font-size: 11px;
                margin-bottom: 10px;
            }

            .field input {
                height: 58px;
                font-size: 17px;
            }

            button {
                height: 58px;
                min-height: 58px;
                font-size: 15px;
            }

            #msg {
                font-size: 13px;
            }

            .card-footer {
                margin-top: 30px;
            }

            .card-footer a {
                font-size: 13px;
            }
        }


        /* =====================================================
           VERY SMALL PHONES
           ===================================================== */

        @media screen and (max-width: 340px) {

            .card {
                padding: 28px 16px;
            }

            .card-header {
                margin-bottom: 30px;
            }

            .card-header h1 {
                font-size: 36px;
            }

            .field {
                margin-bottom: 20px;
            }

            .field input {
                height: 55px;
                font-size: 16px;
            }

            button {
                height: 55px;
                min-height: 55px;
                font-size: 14px;
            }
        }


        /* =====================================================
           LANDSCAPE PHONES
           ===================================================== */

        @media screen and (max-height: 500px) and (orientation: landscape) {

            body {
                display: block;
                padding: 0;
            }

            .card {
                min-height: auto;
                padding: 25px 30px;
                display: block;
            }

            .card-header {
                margin-bottom: 25px;
            }

            .field {
                margin-bottom: 15px;
            }

            .field input {
                height: 46px;
            }

            button {
                height: 46px;
                min-height: 46px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="card-header">
            <p>Quizzers Anonymous</p>
            <h1>Login</h1>
        </div>

        <div class="field">
            <label for="email">Phone Number</label>
            <input id="email" type="text" placeholder="Registered Phone Number">
        </div>

        <div class="field">
            <label for="pswd">Password</label>
            <input id="pswd" type="password" placeholder="••••••••">
        </div>

        <button onclick="login()">Login</button>

        <p id="msg"></p>

        <div class="card-footer">
            <a href="register.html">Don't have an account?</a>
        </div>
    </div>

    <script>
        const SERVER_URL = "";

        document.addEventListener("keydown", e => { if (e.key === "Enter") login(); });

        async function login() {
            const msg  = document.getElementById("msg");
            const data = {
                email:    document.getElementById("email").value,
                password: document.getElementById("pswd").value
            };

            msg.className = "";
            msg.innerText = "Signing in...";

            const response = await fetch(`${SERVER_URL}/api/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.role === "admin") {
                window.location.href = "admin.html";
            } else if (result.userId) {
                sessionStorage.setItem("userId", result.userId);
                sessionStorage.setItem("name",   result.name);
                msg.className = "";
                msg.innerText = `Welcome, ${result.name} — redirecting...`;
                setTimeout(() => { window.location.href = "events.html"; }, 1000);
            } else {
                msg.className = "error";
                msg.innerText = result.error;
            }
        }
    </script>
</body>
</html>
